<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie-Tracker</title>
</head>
<body>
    <header><h1>Header PlaceHolder</h1></header>
    <main>
        <div class ="artist">
            {{range .}}
            <div class ="card">
                <img src = "{{.Image}}" alt ="" width="300" height="300">
                <p>
                    <a href ="/artist?id={{.ID}}">{{.Name}}</a>
                    <br> 
                    Formed in {{.CreationDate}},
                    First Album {{.FirstAlbum}}
                </p>
            </div>
            {{end}}
        </div>
    </main>
</body>
</html>
